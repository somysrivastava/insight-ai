[pytest]
testpaths = app/tests
asyncio_mode = auto
# app/tests has no __init__.py (app/ itself is an implicit namespace
# package, same as everywhere else in this codebase — see app/main.py's
# own `import app.models`) — without this, pytest's default import mode
# adds app/tests/ itself to sys.path instead of the project root,
# and `from app.database import ...` inside conftest.py can't resolve.
pythonpath = .
