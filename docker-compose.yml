x-app-env: &app-env
  env_file:
    - .env
  environment:
    # Overrides whatever DATABASE_URL/REDIS_URL are in .env — inside this
    # network "localhost" doesn't reach the db/redis containers. Shared
    # between app, celery, and migrate below via this anchor so they
    # always agree — one source of truth, not several values that can
    # drift apart.
    DATABASE_URL: postgresql://${POSTGRES_USER:-insightai}:${POSTGRES_PASSWORD:-insightai}@db:5432/${POSTGRES_DB:-insightai_dev}
    REDIS_URL: redis://redis:6379/0
  volumes:
    # Bind-mounts the whole project so code edits hot-reload without a
    # rebuild (app), take effect on the next task pickup (celery), or
    # are picked up by the next migration run without a rebuild
    # (migrate). app/uploads/ (LocalStorageBackend's target) lands on
    # the host filesystem as a side effect — no separate volume needed.
    - .:/app

# Day 27 — separate from x-app-env above: points at test-db (not db) and
# redis logical DB 15 (not 0, so cache_service tests never touch dev's
# real cached results), disables rate limiting (many tests sign up/log
# in more than the real 10/minute auth limit would allow) and enables
# Celery eager mode (no worker container exists in the test stack, so
# .delay() has to run the task body inline or it would just enqueue and
# never execute). LOCAL_STORAGE_ROOT keeps uploaded test files out of
# the real app/uploads and app/exports on disk.
x-test-env: &test-env
  env_file:
    - .env
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-insightai}:${POSTGRES_PASSWORD:-insightai}@test-db:5432/${POSTGRES_TEST_DB:-insightai_test}
    REDIS_URL: redis://redis:6379/15
    RATE_LIMIT_ENABLED: "false"
    CELERY_TASK_ALWAYS_EAGER: "true"
    LOCAL_STORAGE_ROOT: /tmp/insightai-test-storage
  volumes:
    - .:/app

services:
  migrate:
    # Runs once, applies pending Alembic migrations, then exits. app and
    # celery both wait for this to succeed before starting — running
    # `alembic upgrade head` from two containers at once (if app and
    # celery each migrated themselves) risks both racing to apply the
    # same DDL concurrently. One dedicated step, gated by
    # service_completed_successfully, avoids that entirely.
    build: .
    command: alembic upgrade head
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery:
    build: .
    command: celery -A app.worker worker --loglevel=info
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  beat:
    # Fires the two static schedule entries in app/worker.py's
    # beat_schedule (poll ScheduledReport rows every minute; sweep
    # expired exports daily at 3am UTC) — a separate service from
    # `celery` because Beat only schedules tasks, it doesn't execute
    # them; `celery` still does the actual work.
    build: .
    command: celery -A app.worker beat --loglevel=info
    <<: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightai}
      POSTGRES_DB: ${POSTGRES_DB:-insightai_dev}
    ports:
      # Host 5433 avoids clashing with a local Postgres already on 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    # Valkey: the Linux Foundation's fully open-source continuation of
    # Redis (post-7.4 relicensing), protocol-compatible — a drop-in
    # broker/result-backend for Celery. See docs/ADR.md ADR-010.
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    # Day 26 — Vite's own dev server (HMR), not nginx; see
    # frontend/Dockerfile for why. VITE_API_URL points at the backend's
    # host-published port, not a container hostname — Vite only serves
    # JS to the browser, the actual fetch calls run in the browser on
    # the host, where "localhost:8000" is exactly where `app` is
    # published. CORS_ORIGINS on the `app` service (below) has to name
    # this exact origin or the browser rejects every request.
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      # Named volume for node_modules specifically — without this, the
      # bind mount above would shadow the container's own Linux-built
      # node_modules with whatever's on the host (macOS/Windows), and
      # esbuild/Vite (which install a platform-specific native binary)
      # would fail to start.
      - frontend_node_modules:/app/node_modules

  test-db:
    # Throwaway Postgres for the test suite — deliberately separate from
    # `db` (never shares its data, never accidentally read/written by a
    # dev's real dataset) and deliberately without a named volume, since
    # every test run should start from a schema `migrate-test` just
    # applied, not from whatever a previous run left behind. JSONB
    # columns (SavedJoin, DashboardPin, BulkUploadJob, AlertRule,
    # ScheduledReport, ExportJob) rule out SQLite here — same dialect as
    # prod is the only option that doesn't also stub the schema.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-insightai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insightai}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-insightai_test}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insightai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate-test:
    # Same one-shot-before-anything-else pattern as `migrate`, pointed
    # at test-db instead.
    build: .
    command: alembic upgrade head
    <<: *test-env
    depends_on:
      test-db:
        condition: service_healthy
    restart: "no"

  test:
    # `docker compose run --rm test` — pytest against test-db, coverage
    # printed to the console AND written to coverage.xml (bind-mounted
    # out to the host) so check_coverage.py can enforce the 100%
    # security/financial-critical-path floor on top of pytest-cov's own
    # global 80% gate.
    build: .
    command: sh -c "pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80 && python scripts/check_coverage.py"
    <<: *test-env
    depends_on:
      test-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-test:
        condition: service_completed_successfully

volumes:
  postgres_data:
  frontend_node_modules:
